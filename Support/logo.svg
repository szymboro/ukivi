<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="kiwi" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#c3202c"/>
    </linearGradient>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(5,-40)">
  <g id="bird" fill="url(#kiwi)" stroke="url(#kiwi)" stroke-linecap="round" stroke-linejoin="round">
